<style>
*{box-sizing:border-box}
body{--bg:#ffeef4;--bg2:#ffd3e4;--text:#3a2230;--muted:#94707f;--card:#fffafc;--line:#f6cfe0;--accent:#c43878;--bb:#ffe1ec;--bt:#6b2342;--bl:#f4a9c4;--dg:#d6456b;--top:linear-gradient(135deg,#ffcfe1,#ffeaf2);--sh:rgba(196,56,120,.18);color-scheme:light;margin:0;min-height:100vh;color:var(--text);background:radial-gradient(900px 520px at 6% -8%,var(--bg2),transparent 62%),radial-gradient(700px 440px at 100% 0,var(--bg2),transparent 58%),var(--bg);background-attachment:fixed;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.dark-mode{--bg:#140a0f;--bg2:#33121d;--text:#ffc9d4;--muted:#c98a99;--card:#22111a;--line:#4a2634;--accent:#ff9db4;--bb:#3a1a26;--bt:#ffb6c1;--bl:#5c2c3d;--dg:#ff8da1;--top:linear-gradient(135deg,#4a1626,#2a0b15);--sh:rgba(0,0,0,.5);color-scheme:dark}
body.dark-blue-mode{--bg:#060b1b;--bg2:#10285e;--text:#e2e8f0;--muted:#7c93b8;--card:#0d1836;--line:#1b2f63;--accent:#38bdf8;--bb:#13265a;--bt:#7dd3fc;--bl:#25408a;--dg:#ff8da1;--top:linear-gradient(135deg,#17306e,#0b1635);--sh:rgba(0,0,0,.55);color-scheme:dark}
body.black-mode{--bg:#000;--bg2:#1d1d1d;--text:#f5f5f5;--muted:#9a9a9a;--card:#0f0f0f;--line:#262626;--accent:#fff;--bb:#1c1c1c;--bt:#fff;--bl:#3a3a3a;--dg:#ff8da1;--top:linear-gradient(135deg,#262626,#0a0a0a);--sh:rgba(0,0,0,.7);color-scheme:dark}

.app{max-width:1000px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
.top{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:20px 22px;border-radius:28px;border:1px solid var(--line);background:var(--top);box-shadow:0 10px 30px var(--sh)}
.top h1{margin:0;font-size:1.6rem;letter-spacing:-.01em;color:var(--accent)}
.top p{margin:3px 0 0;font-size:.88rem;color:var(--muted)}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.panel{margin-top:18px;padding-top:22px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 14px 40px var(--sh)}
.btn{font:inherit;font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--bl);background:var(--bb);color:var(--bt);cursor:pointer;transition:transform .15s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-outline{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--dg);border-color:var(--dg)}
.btn-sm{padding:7px 13px;font-size:12px}
.themes .btn{display:inline-flex;align-items:center;gap:7px;color:var(--bt)}
.themes .btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.sw{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;flex:none}
[data-theme=""] .sw{background:linear-gradient(135deg,#f8aacb,#d63a7c)}
[data-theme="dark-mode"] .sw{background:linear-gradient(135deg,#6e2a40,#150609)}
[data-theme="dark-blue-mode"] .sw{background:linear-gradient(135deg,#38bdf8,#0b1635)}
[data-theme="black-mode"] .sw{background:linear-gradient(135deg,#777,#000)}
#calculadora>.section-heading,#calcToggleBtn{display:none!important}
footer{margin-top:24px;text-align:center;font-size:.8rem;color:var(--muted)}

#calcBody[hidden]{display:none!important}
#calcBody{padding:0 24px 28px}
#calculadora{--h-bg:#fff4f8;--h-line:#fbd6e5;--h-text:#3a2230;--h-muted:#94707f;--h-accent:#c43878}
body.dark-mode #calculadora{--h-bg:#1b0d14;--h-line:#4a2634;--h-text:#ffc9d4;--h-muted:#c98a99;--h-accent:#ff9db4}
body.dark-blue-mode #calculadora{--h-bg:#091330;--h-line:#1b2f63;--h-text:#e2e8f0;--h-muted:#7c93b8;--h-accent:#38bdf8}
body.black-mode #calculadora{--h-bg:#171717;--h-line:#2e2e2e;--h-text:#fff;--h-muted:#9a9a9a;--h-accent:#fff}

.calc-layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:28px;align-items:start;margin-top:10px}
@media (max-width:760px){.calc-layout{grid-template-columns:1fr}.calc-device{margin:0 auto}}

.calc-device{--c-body-top:#fbb6d2;--c-body-bot:#ef7fae;--c-screen:#ffe3ee;--c-screen-text:#5a1f3a;--c-key:#fff0f6;--c-key-text:#6a2a45;--c-line:#7a2f4d;--c-key-sh:#d9779f;--c-solar:#4a3b3b;--c-op:#ffc2da;--c-op-text:#8a1f55;--c-eq:#d63a7c;--c-eq-text:#fff;--c-clr:#ffd9b8;--c-clr-text:#7a3a14;--c-fn:#f7a2c4;--c-fn-text:#5a1f3a;--c-gloss:rgba(255,255,255,.6);
width:calc(100% - 6px);max-width:354px;padding:16px 16px 20px;border-radius:30px;border:3px solid var(--c-line);background:linear-gradient(180deg,var(--c-body-top) 0%,var(--c-body-top) 30%,var(--c-body-bot) 100%);box-shadow:inset 0 2px 0 var(--c-gloss),6px 6px 0 var(--c-line),0 22px 40px var(--sh);user-select:none;-webkit-user-select:none}
body.dark-mode .calc-device{--c-body-top:#4a1626;--c-body-bot:#2a0b15;--c-screen:#150609;--c-screen-text:#ffb6c1;--c-key:#33161f;--c-key-text:#ffc4d0;--c-line:#6e2a40;--c-key-sh:#12050a;--c-solar:#150609;--c-op:#4a1f2e;--c-op-text:#ff9db4;--c-eq:#ff7d9d;--c-eq-text:#2a0b15;--c-clr:#5a2a2f;--c-clr-text:#ffc7a8;--c-fn:#3d1826;--c-fn-text:#ffb6c1;--c-gloss:rgba(255,255,255,.09)}
body.dark-blue-mode .calc-device{--c-body-top:#17306e;--c-body-bot:#0b1635;--c-screen:#050a1a;--c-screen-text:#5fd0ff;--c-key:#182f66;--c-key-text:#bfe6ff;--c-line:#2a4a95;--c-key-sh:#040814;--c-solar:#050a1a;--c-op:#1f3d82;--c-op-text:#5fd0ff;--c-eq:#38bdf8;--c-eq-text:#04122b;--c-clr:#3a2f6e;--c-clr-text:#d6c9ff;--c-fn:#13265a;--c-fn-text:#7dd3fc;--c-gloss:rgba(255,255,255,.1)}
body.black-mode .calc-device{--c-body-top:#232323;--c-body-bot:#0e0e0e;--c-screen:#000;--c-screen-text:#fff;--c-key:#2a2a2a;--c-key-text:#f2f2f2;--c-line:#474747;--c-key-sh:#000;--c-solar:#000;--c-op:#3b3b3b;--c-op-text:#fff;--c-eq:#fff;--c-eq-text:#000;--c-clr:#4a4a4a;--c-clr-text:#ffb3c0;--c-fn:#1c1c1c;--c-fn-text:#cfcfcf;--c-gloss:rgba(255,255,255,.12)}

.calc-solar{display:flex;justify-content:flex-end;gap:3px;margin:0 4px 12px 0}
.calc-solar i{display:block;width:18px;height:22px;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 55%),var(--c-solar);border:2px solid var(--c-line);border-radius:4px}

   Usa jsPDF, que ya cargás en el index.html.
========================================================= */
(function () {
  'use strict';
  if (window.__mensualesCalc) return;
  window.__mensualesCalc = true;

  var LS_KEY = 'recalculando_history';
  var MAX_HIST = 200;
  var OPS = ['+', '−', '×', '÷'];

  /* ---------------------------------------------------------
     Estado
  --------------------------------------------------------- */
  var expr = '';          // expresión interna: usa "." decimal y − × ÷
  var justEval = false;   // se acaba de apretar "="
  var errorMsg = '';
  var lastExpr = '';
  var lastRes = null;
  var memory = 0;
  var hasMem = false;
  var isOn = true;
  var hist = [];
  var voicePreview = '';   // lo que se va dictando, antes de confirmarse

  try {
    var saved = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    if (Array.isArray(saved)) {
      hist = saved.filter(function (h) {
        return h && typeof h.expr === 'string' && typeof h.res === 'number' && h.t;
      });
    }
  } catch (e) { hist = []; }

  function saveHist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(hist)); } catch (e) {}
  }

  /* ---------------------------------------------------------
     Formato
  --------------------------------------------------------- */
  function fmt(n) {
    return n.toLocaleString('es-AR', { maximumFractionDigits: 10 });
  }
  function plain(n) {
    return n.toLocaleString('en-US', { useGrouping: false, maximumFractionDigits: 10 }).replace('-', '−');
  }
  function show(s) { return s.replace(/\./g, ','); }
  function clean(v) { return parseFloat(v.toPrecision(12)); }

  /* ---------------------------------------------------------
     Motor de cálculo (sin eval)
     Soporta + − × ÷ ( ) y %.
     "200 + 10%" = 220 · "50%" = 0,5 · "200 × 10%" = 20
  --------------------------------------------------------- */
  function evaluate(src) {
    var tokens = src.match(/\d+\.?\d*|\.\d+|[+−×÷()%]/g) || [];
    var i = 0;
    var peek = function () { return tokens[i]; };

    function parseExpr() {
      var left = parseTerm();
      while (peek() === '+' || peek() === '−') {
        var op = tokens[i++];
        var r = parseTerm();
        var rv = r.v;
        if (r.pct && r.simple) rv = left.v * r.v; // 200 + 10% -> 200 + 20
        left = { v: op === '+' ? left.v + rv : left.v - rv, pct: false, simple: false };
      }
      return left;
    }

    function parseTerm() {
      var left = parseFactor();
      var simple = true;
      while (peek() === '×' || peek() === '÷') {
        var op = tokens[i++];
        var r = parseFactor();
        if (op === '÷' && r.v === 0) throw new Error('División por 0');
        left = { v: op === '×' ? left.v * r.v : left.v / r.v, pct: false };
        simple = false;
      }
      return { v: left.v, pct: left.pct, simple: simple && left.pct };
    }

    function parseFactor() {
      var t = peek();
      var v;
      var pct = false;
      if (t === '−') { i++; var f = parseFactor(); return { v: -f.v, pct: f.pct }; }
      if (t === '+') { i++; return parseFactor(); }
      if (t === '(') {
        i++;
        var e = parseExpr();
        if (peek() !== ')') throw new Error('Error');
        i++;
        v = e.v;
      } else if (t && /^[\d.]/.test(t)) {
        i++;
        v = parseFloat(t);
      } else {
        throw new Error('Error');
      }
      while (peek() === '%') { i++; v = v / 100; pct = true; }
      return { v: v, pct: pct };
    }

    var out = parseExpr();
    if (i < tokens.length) throw new Error('Error');
    if (!isFinite(out.v)) throw new Error('Error');
    return clean(out.v);
  }

  // Saca operadores sueltos al final y cierra paréntesis abiertos
  function cleanExpr(e) {
    var s = e.replace(/[+−×÷]+$/, '');
    if (s === '' || s === '−') return '';
    var open = (s.match(/\(/g) || []).length;
    var close = (s.match(/\)/g) || []).length;
    s = s.replace(/\($/, '');
    for (var k = 0; k < open - close; k++) s += ')';
    return s;
  }

  /* ---------------------------------------------------------
     Entrada
  --------------------------------------------------------- */
  function lastNum() { return (expr.match(/[\d.]*$/) || [''])[0]; }

  function inputNum(k) {
    if (justEval) { expr = ''; justEval = false; }
    if (/[)%]$/.test(expr)) return;
    var seg = lastNum();
    if (k === '.') {
      if (seg.indexOf('.') !== -1) return;
      expr += seg === '' ? '0.' : '.';
      return;
    }
    if (k === '00') {
      if (seg === '') expr += '0';
      else if (seg !== '0') expr += '00';
      return;
    }
    if (seg === '0') { expr = expr.slice(0, -1) + k; return; }
    expr += k;
  }

  function inputOp(op) {
    justEval = false;
    var last = expr.slice(-1);
    if (expr === '') { if (op === '−') expr = '−'; return; }
    if (expr === '−') return;
    if (last === '(') { if (op === '−') expr += '−'; return; }
    if (OPS.indexOf(last) !== -1) {
      if (op === '−' && (last === '×' || last === '÷')) { expr += '−'; return; }
      expr = expr.replace(/[+−×÷]+$/, '') + op;
      return;
    }
    expr += op;
  }

  function inputPct() {
    justEval = false;
    if (/[\d)%]$/.test(expr)) expr += '%';
  }

  function inputParen(k) {
    if (k === '(') {
      if (justEval) { expr = ''; justEval = false; }
      if (expr === '' || /[+−×÷(]$/.test(expr)) expr += '(';
    } else {
      var open = (expr.match(/\(/g) || []).length;
      var close = (expr.match(/\)/g) || []).length;
      if (open > close && /[\d)%]$/.test(expr)) expr += ')';
      justEval = false;
    }
  }

  // Reemplaza el número actual (o lo agrega si corresponde)
  function insertValue(n) {
    if (justEval) { expr = ''; justEval = false; }
    var seg = lastNum();
    if (seg !== '') expr = expr.slice(0, expr.length - seg.length) + plain(n);
    else if (!/[)%]$/.test(expr)) expr += plain(n);
  }

  function currentValue() {
    if (justEval) return lastRes;
    var src = cleanExpr(expr);
    if (!src) return null;
    try { return evaluate(src); } catch (e) { return null; }
  }

  function equals() {
    if (expr === '' || justEval) return;
    var src = cleanExpr(expr);
    if (!src) return;
    try {
      var r = evaluate(src);
      lastExpr = show(src);
      lastRes = r;
      if (/[+−×÷%()]/.test(src.replace(/^−/, ''))) pushHist(lastExpr, r);
      expr = plain(r);
      justEval = true;
    } catch (e) {
      errorMsg = e.message || 'Error';
      expr = '';
      justEval = false;
    }
  }

  function press(k) {
    if (!isOn && k !== 'ON') return;
    if (errorMsg && k !== 'ON') { errorMsg = ''; expr = ''; justEval = false; }

    if (/^\d$/.test(k) || k === '00' || k === '.') inputNum(k);
    else if (OPS.indexOf(k) !== -1) inputOp(k);
    else if (k === '%') inputPct();
    else if (k === '(' || k === ')') inputParen(k);
    else if (k === '=') equals();
    else if (k === 'CE') {
      if (justEval) { expr = ''; justEval = false; } else expr = expr.slice(0, -1);
    } else if (k === 'ON') {
      expr = ''; justEval = false; errorMsg = ''; lastExpr = ''; lastRes = null; isOn = true;
    } else if (k === 'OFF') {
      isOn = false;
    } else if (k === 'M+') {
      var v = currentValue();
      if (v !== null) { memory = clean(memory + v); hasMem = true; }
    } else if (k === 'MC') {
      memory = 0; hasMem = false;
    } else if (k === 'MR') {
      if (hasMem) insertValue(memory);
    }
    render();
  }

  /* ---------------------------------------------------------
     Historial
  --------------------------------------------------------- */
  function pushHist(e, r) {
    hist.push({ t: new Date().toISOString(), expr: e, res: r });
    if (hist.length > MAX_HIST) hist.shift();
    saveHist();
    renderHist();
  }

  /* ---------------------------------------------------------
     Exportar
  --------------------------------------------------------- */
  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportCSV() {
    if (!hist.length) { alert('Todavía no hay cuentas para exportar.'); return; }
    var q = function (s) { return '"' + String(s).replace(/"/g, '""') + '"'; };
    var rows = [['Fecha', 'Hora', 'Operación', 'Resultado']];
    hist.forEach(function (h) {
      var d = new Date(h.t);
      rows.push([
        d.toLocaleDateString('es-AR'),
        d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
        h.expr,
        h.res.toLocaleString('en-US', { useGrouping: false, maximumFractionDigits: 10 }).replace('.', ',')
      ]);
    });
    var csv = '\ufeff' + rows.map(function (r) { return r.map(q).join(';'); }).join('\r\n');
    download(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), 're-calculando.csv');
  }

  function exportPDF() {
    if (!hist.length) { alert('Todavía no hay cuentas para exportar.'); return; }
    var lib = window.jspdf && window.jspdf.jsPDF;
    if (!lib) { alert('No se pudo cargar el generador de PDF. Revisá tu conexión e intentá de nuevo.'); return; }

    var doc = new lib();
    doc.setProperties({ title: 'Re calculando', author: 'Flor Bagnis' });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var GS = doc.GState;

    // Paleta kawaii según el modo activo
    var cl = document.body.classList;
    var P = cl.contains('black-mode')
      ? { bg: [0, 0, 0], head: [38, 38, 38], headText: [255, 255, 255], accent: [255, 255, 255], sub: [154, 154, 154], text: [255, 255, 255], line: [70, 70, 70],
          cards: [[26, 26, 26], [38, 38, 38], [30, 30, 30], [44, 44, 44]], deco: [[255, 255, 255], [255, 157, 180], [200, 200, 200]], opa: 0.3,
          face: [255, 255, 255], ink: [0, 0, 0], blush: [255, 140, 170], pill: [255, 255, 255], pillText: [0, 0, 0] }
      : cl.contains('dark-blue-mode')
      ? { bg: [6, 11, 27], head: [23, 48, 110], headText: [191, 230, 255], accent: [56, 189, 248], sub: [124, 147, 184], text: [226, 232, 240], line: [42, 74, 149],
          cards: [[24, 47, 102], [30, 62, 130], [23, 80, 120], [36, 56, 118]], deco: [[95, 208, 255], [125, 170, 255], [168, 230, 255]], opa: 0.45,
          face: [214, 240, 255], ink: [4, 18, 43], blush: [255, 140, 190], pill: [56, 189, 248], pillText: [4, 18, 43] }
      : cl.contains('dark-mode')
      ? { bg: [20, 10, 15], head: [74, 22, 38], headText: [255, 201, 212], accent: [255, 157, 180], sub: [201, 138, 153], text: [255, 201, 212], line: [110, 42, 64],
          cards: [[51, 22, 31], [64, 26, 43], [78, 30, 52], [58, 22, 38]], deco: [[255, 141, 161], [255, 182, 214], [255, 170, 195]], opa: 0.45,
          face: [255, 214, 224], ink: [42, 11, 21], blush: [255, 120, 150], pill: [255, 157, 180], pillText: [42, 11, 21] }
      : { bg: [255, 240, 247], head: [255, 201, 224], headText: [122, 31, 77], accent: [214, 58, 124], sub: [148, 112, 127], text: [58, 34, 48], line: [246, 190, 213],
          cards: [[255, 232, 242], [238, 230, 255], [214, 245, 232], [255, 244, 205]], deco: [[255, 143, 184], [255, 196, 107], [183, 156, 255]], opa: 0.6,
          face: [255, 255, 255], ink: [90, 31, 58], blush: [255, 140, 170], pill: [214, 58, 124], pillText: [255, 255, 255] };

    function fill(c) { doc.setFillColor(c[0], c[1], c[2]); }
    function tint(c) { doc.setTextColor(c[0], c[1], c[2]); }
    function opacity(o) { doc.setGState(new GS({ opacity: o })); }

    // Corazón dibujado (el emoji no existe en el PDF)
    function heart(cx, cy, r) {
      doc.circle(cx - r, cy, r, 'F');
      doc.circle(cx + r, cy, r, 'F');
      doc.triangle(cx - 2 * r + 0.05 * r, cy + 0.38 * r, cx + 2 * r - 0.05 * r, cy + 0.38 * r, cx, cy + 2.8 * r, 'F');
    }
    // Estrellita de 4 puntas
    function spark(cx, cy, R) {
      var r = R * 0.32;
      var pts = [[0, -R], [r, -r], [R, 0], [r, r], [0, R], [-r, r], [-R, 0], [-r, -r]];
      var v = [];
      for (var i = 1; i < pts.length; i++) v.push([pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]]);
      doc.lines(v, cx + pts[0][0], cy + pts[0][1], [1, 1], 'F', true);
    }
    // Carita kawaii
    function face(x, y, r) {
      var s = r / 7;
      fill(P.face); doc.circle(x, y, r, 'F');
      fill(P.blush); opacity(0.7);
      doc.ellipse(x - r * 0.58, y + r * 0.28, r * 0.2, r * 0.13, 'F');
      doc.ellipse(x + r * 0.58, y + r * 0.28, r * 0.2, r * 0.13, 'F');
      opacity(1);
      fill(P.ink);
      doc.circle(x - r * 0.34, y - r * 0.1, r * 0.1, 'F');
      doc.circle(x + r * 0.34, y - r * 0.1, r * 0.1, 'F');
      doc.setDrawColor(P.ink[0], P.ink[1], P.ink[2]);
      doc.setLineWidth(0.45);
      doc.lines([[0.7 * s, 0.7 * s], [1.0 * s, 0.25 * s], [1.0 * s, -0.25 * s], [0.7 * s, -0.7 * s]], x - 1.7 * s, y + 1.5 * s, [1, 1], 'S');
    }

    // Paleta del moño según el modo
    var B = cl.contains('black-mode')
      ? { f: [255, 255, 255], e: [150, 150, 150], k: [255, 157, 180], t: [226, 226, 226] }
      : cl.contains('dark-blue-mode')
      ? { f: [125, 211, 252], e: [42, 74, 149], k: [189, 180, 255], t: [95, 208, 255] }
      : cl.contains('dark-mode')
      ? { f: [255, 141, 161], e: [150, 54, 84], k: [255, 210, 138], t: [255, 170, 190] }
      : { f: [255, 143, 184], e: [201, 64, 127], k: [255, 105, 165], t: [255, 178, 210] };

    // Moño dibujado con curvas (cx, cy = nudo central; s = tamaño)
    function bow(cx, cy, s) {
      doc.setDrawColor(B.e[0], B.e[1], B.e[2]);
      doc.setLineWidth(Math.max(0.25, 0.16 * s));
      fill(B.t);
      doc.triangle(cx - 0.2 * s, cy, cx - 1.9 * s, cy + 2.6 * s, cx + 0.35 * s, cy + 2.0 * s, 'FD');
      doc.triangle(cx + 0.2 * s, cy, cx + 1.9 * s, cy + 2.6 * s, cx - 0.35 * s, cy + 2.0 * s, 'FD');
      fill(B.f);
      doc.lines([[-0.4, -1.2, -1.9, -1.4, -2.1, -0.3], [-0.1, 1.1, 1.7, 1.6, 2.1, 0.3]], cx, cy, [s, s], 'FD', true);
      doc.lines([[0.4, -1.2, 1.9, -1.4, 2.1, -0.3], [0.1, 1.1, -1.7, 1.6, -2.1, 0.3]], cx, cy, [s, s], 'FD', true);
      opacity(0.65);
      fill([255, 255, 255]);
      doc.ellipse(cx - 1.25 * s, cy - 0.42 * s, 0.5 * s, 0.22 * s, 'F');
      doc.ellipse(cx + 1.25 * s, cy - 0.42 * s, 0.5 * s, 0.22 * s, 'F');
      opacity(1);
      fill(B.k);
      doc.circle(cx, cy, 0.62 * s, 'FD');
    }
    // Nubecita
    function cloud(cx, cy, r) {
      doc.circle(cx - r, cy, r * 0.8, 'F');
      doc.circle(cx, cy - r * 0.45, r, 'F');
      doc.circle(cx + r, cy, r * 0.8, 'F');
      doc.rect(cx - r, cy, 2 * r, r * 0.8, 'F');
    }

    // Adornos en los márgenes (0 = corazón, 1 = estrella, 2 = puntito, 3 = moño, 4 = nube)
    var DECO = [[7, 60, 0], [pageW - 7, 78, 3], [6, 98, 4], [pageW - 7, 118, 1], [7, 138, 3], [pageW - 6, 158, 0],
                [6, 178, 1], [pageW - 7, 198, 4], [7, 218, 0], [pageW - 7, 238, 3], [6, 256, 1], [pageW - 6, 272, 0],
                [8, 280, 2], [pageW - 12, 284, 2], [pageW - 8, 52, 1], [7, 40, 2]];
    function paint() {
      fill(P.bg);
      doc.rect(0, 0, pageW, pageH, 'F');
      // fondo de lunaritos / puntitos pastel
      opacity(P.opa * 0.3);
      fill(P.deco[0]);
      for (var gy = 4; gy < pageH + 8; gy += 13) {
        for (var gx = ((Math.round(gy / 13) % 2) ? 5 : 11); gx < pageW + 8; gx += 14) doc.circle(gx, gy, 0.8, 'F');
      }
      opacity(P.opa);
      DECO.forEach(function (d, i) {
        fill(P.deco[i % 3]);
        if (d[2] === 0) heart(d[0], d[1], 1.9);
        else if (d[2] === 1) spark(d[0], d[1], 3);
        else if (d[2] === 2) doc.circle(d[0], d[1], 1.1, 'F');
        else if (d[2] === 4) cloud(d[0], d[1], 1.7);
      });
      opacity(1);
      DECO.forEach(function (d) { if (d[2] === 3) bow(d[0], d[1], 1.15); });
    }

    function header() {
      // sombrita rosa
      fill(P.line);
      doc.roundedRect(16, 15, pageW - 28, 33, 10, 10, 'F');
      // tarjeta del encabezado con borde punteado
      fill(P.head);
      doc.setDrawColor(P.accent[0], P.accent[1], P.accent[2]);
      doc.setLineWidth(0.7);
      doc.setLineDashPattern([1.6, 1.6], 0);
      doc.roundedRect(14, 12, pageW - 28, 33, 10, 10, 'FD');
      doc.setLineDashPattern([], 0);
      // puntitos dentro del encabezado
      opacity(0.35);
      fill([255, 255, 255]);
      [[60, 17], [92, 40], [118, 19], [150, 41], [pageW - 40, 17], [pageW - 62, 39], [78, 28], [136, 30]].forEach(function (d) { doc.circle(d[0], d[1], 1.1, 'F'); });
      opacity(1);
      // carita + moño grande
      face(32, 29, 10);
      bow(24, 14, 2.5);
      // título
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(23);
      tint(P.headText);
      doc.text('Re calculando', 48, 27);
      var tw = doc.getTextWidth('Re calculando');
      fill(P.accent);
      spark(48 + tw + 6, 21, 2.8);
      heart(48 + tw + 14, 24, 1.4);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      tint(P.headText);
      doc.text('Generado el ' + new Date().toLocaleString('es-AR'), 48, 35);
      // contador de cuentas
      var label = hist.length + (hist.length === 1 ? ' cuenta' : ' cuentas');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      var pw = doc.getTextWidth(label) + 14;
      fill(P.pill);
      doc.roundedRect(pageW - 20 - pw, 35, pw, 8, 4, 4, 'F');
      fill(P.pillText);
      heart(pageW - 20 - pw + 5, 38.8, 0.9);
      tint(P.pillText);
      doc.text(label, pageW - 20 - pw / 2 + 2, 40.6, { align: 'center' });
    }

    paint();
    header();

    var GAP = 8, CW = (pageW - 28 - GAP) / 2, CH = 40;

    // Resumen: tres stickers
    var maxRes = hist.reduce(function (mx, h) { return h.res > mx ? h.res : mx; }, hist[0].res);
    var stats = [
      { ic: 0, t: hist.length + (hist.length === 1 ? ' cuenta' : ' cuentas') },
      { ic: 1, t: 'Mayor: ' + fmt(maxRes) },
      { ic: 2, t: 'Ultima: ' + fmt(hist[hist.length - 1].res) }
    ];
    var sx = 14;
    stats.forEach(function (st, k) {
      var label = st.t.replace(/−/g, '-');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      var sw = doc.getTextWidth(label) + 17;
      fill(P.cards[k]);
      doc.setDrawColor(P.accent[0], P.accent[1], P.accent[2]);
      doc.setLineWidth(0.4);
      doc.setLineDashPattern([1, 1], 0);
      doc.roundedRect(sx, 50, sw, 9.5, 4.75, 4.75, 'FD');
      doc.setLineDashPattern([], 0);
      fill(P.accent);
      if (st.ic === 0) heart(sx + 5.2, 54, 1.25);
      else if (st.ic === 1) spark(sx + 5.2, 54.8, 2.3);
      else doc.circle(sx + 5.2, 54.8, 1.4, 'F');
      tint(P.text);
      doc.text(label, sx + 10.5, 56.2);
      sx += sw + 5;
    });

    // Una cuenta = una tarjeta tipo sticker
    function drawCard(h, idx, x, y) {
      var w = CW;
      var d = new Date(h.t);
      var fecha = d.toLocaleDateString('es-AR') + '  ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

      fill(P.line);
      doc.roundedRect(x + 1.3, y + 1.6, w, CH, 8, 8, 'F');
      fill(P.cards[idx % 4]);
      doc.setDrawColor(P.accent[0], P.accent[1], P.accent[2]);
      doc.setLineWidth(0.45);
      doc.setLineDashPattern([1.3, 1.3], 0);
      doc.roundedRect(x, y, w, CH, 8, 8, 'FD');
      doc.setLineDashPattern([], 0);

      // cinta washi
      opacity(0.9);
      fill(P.deco[idx % 3]);
      doc.lines([[20, 0], [-2.6, 6], [-20, 0]], x + w / 2 - 8, y - 3.2, [1, 1], 'F', true);
      opacity(0.55);
      fill([255, 255, 255]);
      doc.circle(x + w / 2 - 3, y - 0.3, 0.7, 'F');
      doc.circle(x + w / 2 + 3, y - 0.3, 0.7, 'F');
      doc.circle(x + w / 2 + 9, y - 0.3, 0.7, 'F');
      opacity(1);

      // numerito
      fill(P.pill);
      doc.circle(x + 9, y + 11, 5, 'F');
      doc.setFont('helvetica', 'bold');

      doc.setFontSize(10);
      tint(P.text);
      var lines = doc.splitTextToSize(h.expr.replace(/−/g, '-'), w - 34);
      if (lines.length > 3) { lines = lines.slice(0, 3); lines[2] = lines[2].replace(/.{0,2}$/, '..'); }
      doc.text(lines, x + 17, y + 10.5);

      opacity(0.85);
      fill(P.accent);
      heart(x + w - 9, y + 8.5, 1.4);
      opacity(1);

      // burbuja del resultado con carita
      var bx = x + 6, by = y + CH - 18, bw = w - 12, bh = 12;

      doc.setDrawColor(P.line[0], P.line[1], P.line[2]);
      doc.setLineWidth(0.5);
      doc.roundedRect(bx, by, bw, bh, 6, 6, 'FD');
      face(bx + 7, by + bh / 2, 4);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      tint(P.sub);
      doc.text('=', bx + 14.5, by + bh / 2 + 1.3);
      var rt = fmt(h.res).replace(/−/g, '-');
      var fs = 16;
      doc.setFontSize(fs);
      while (doc.getTextWidth(rt) > bw - 26 && fs > 7) { fs -= 1; doc.setFontSize(fs); }
      tint(P.accent);
      doc.text(rt, bx + bw - 6, by + bh / 2 + fs * 0.125, { align: 'right' });

      doc.setFontSize(6.5);
      tint(P.sub);
      doc.text(fecha, x + w - 8, y + CH - 2.3, { align: 'right' });
    }

    var cy = 68, col = 0;
    hist.forEach(function (h, idx) {
      if (col === 0 && cy + CH > pageH - 22) { doc.addPage(); paint(); cy = 18; }
      drawCard(h, idx, 14 + col * (CW + GAP), cy);
      col++;
      if (col === 2) { col = 0; cy += CH + 9; }
    });
    if (col === 1) {
      // lugarcito vacío con mensaje

      doc.setDrawColor(P.accent[0], P.accent[1], P.accent[2]);
      doc.setLineWidth(0.45);
      doc.setLineDashPattern([1.3, 1.3], 0);
      opacity(0.7);
      doc.roundedRect(px, cy, CW, CH, 8, 8, 'S');
      doc.setLineDashPattern([], 0);
      fill(P.deco[0]);
      cloud(px + CW / 2, cy + 15, 3.2);
      fill(P.accent);
      heart(px + CW / 2 - 14, cy + 28, 1.5);
      heart(px + CW / 2 + 14, cy + 28, 1.5);
      opacity(1);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(9.5);
      tint(P.sub);

    var pages = doc.internal.getNumberOfPages();

      doc.setFontSize(9);
      tint(P.sub);
      var tw = doc.getTextWidth(credit);
      var r = 1.3, gap = 3, hw = r * 4;
      var x0 = (pageW - (tw + gap + hw)) / 2;
      var fy = pageH - 9;

      fill(P.accent);
      heart(x0 + tw + gap + hw / 2, fy - 2.6, r);

      spark(x0 + tw + gap + hw + 8, fy - 1.5, 2);

  function histRow(n) {
    var h = hist[n];

    if (n === editing) {
      row.className += ' is-editing';
      var inp = document.createElement('input');
      inp.type = 'text';

      var err = document.createElement('small');
      err.className = 'h-err';
      var ok = icoBtn('✔', 'Guardar cambios');
      var no = icoBtn('✖', 'Cancelar');

      var save = function () {
        var src = toInternal(inp.value);
        try {
          if (!/^[\d.+−×÷()%]+$/.test(src)) throw new Error('Error');
          var r = evaluate(src);
          h.expr = show(src);
          h.res = r;
          editing = -1;
          saveHist();
          renderHist();
        } catch (e) {
          err.textContent = e && e.message && e.message !== 'Error' ? e.message : 'Operación no válida. Ejemplo: 8000/2';

      ok.addEventListener('click', save);
      no.addEventListener('click', function () { editing = -1; renderHist(); });

        if (e.key === 'Enter') { e.preventDefault(); save(); }
        else if (e.key === 'Escape') { e.preventDefault(); editing = -1; renderHist(); }

      row.appendChild(inp);
      row.appendChild(ok);
      row.appendChild(no);
      row.appendChild(err);

    acts.appendChild(del);

    row.appendChild(acts);
    return row;
  }

  var KEYMAP = {

  function onKeydown(e) {
    var body = $('calcBody');
    if (!body || body.hidden) return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;

    var panel = $('calculadora');
    var t = e.target;
    var inCalc = panel && panel.contains(t);
    if (!inCalc && t !== document.body) return;
    if (t.closest && t.closest('input, textarea, select, [contenteditable="true"], #calcVoiceBtn, .calc-voice-tests button')) return;

    var k = null;
    if (/^\d$/.test(e.key)) k = e.key;
    else if (Object.prototype.hasOwnProperty.call(KEYMAP, e.key)) k = KEYMAP[e.key];
    if (k === null) return;

    e.preventDefault();
    flash(k);
    press(k);

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  var rec = null;
  var listening = false;
  var speaking = false;

  var UNITS = {
    cero: 0, un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9,
    diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19,
    veinte: 20, veintiun: 21, veintiuno: 21, veintiuna: 21, veintidos: 22, veintitres: 23, veinticuatro: 24, veinticinco: 25,
    veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29,
    treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90,
    cien: 100, ciento: 100, doscientos: 200, doscientas: 200, trescientos: 300, trescientas: 300,
    cuatrocientos: 400, cuatrocientas: 400, quinientos: 500, quinientas: 500, seiscientos: 600, seiscientas: 600,
    setecientos: 700, setecientas: 700, ochocientos: 800, ochocientas: 800, novecientos: 900, novecientas: 900
  };
  var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };

  // "dos mil quinientos treinta y cinco" -> 2535
  function parseWords(tk, i) {
    var total = 0, cur = 0, any = false, last = 0, j = i;
    while (j < tk.length) {
      var t = tk[j];
      if (has(UNITS, t)) {
        var v = UNITS[t];
        if (t === 'cero' && any) break;
        if (v < 10 && v > 0 && last !== 0 && last % 10 !== 0) break;
        if (v >= 10 && v < 100 && last !== 0 && !(last >= 100 && last % 100 === 0)) break;
        if (v >= 100 && last !== 0) break;
        cur += v; last = v; any = true; j++;
      } else if (t === 'mil') {
        cur = cur || 1; total += cur * 1000; cur = 0; last = 0; any = true; j++;
      } else if (t === 'millon' || t === 'millones') {
        total += (cur || 1) * 1000000; cur = 0; last = 0; any = true; j++;
      } else if (t === 'y' && any && j > 0 && has(UNITS, tk[j - 1]) && UNITS[tk[j - 1]] >= 20 && UNITS[tk[j - 1]] < 100 &&
                 j + 1 < tk.length && has(UNITS, tk[j + 1]) && UNITS[tk[j + 1]] > 0 && UNITS[tk[j + 1]] < 10) {
        j++;
      } else break;
    }
    return any ? { v: total + cur, next: j } : null;
  }

  // "coma cinco" -> ".5"   "coma cero cinco" -> ".05"
  function readDec(tk, j) {
    var k = j + 1, d = '';
    while (k < tk.length && tk[k] === 'cero') { d += '0'; k++; }
    if (k < tk.length) {
      if (/^\d+$/.test(tk[k])) { d += tk[k]; k++; }
      else { var w = parseWords(tk, k); if (w) { d += String(w.v); k = w.next; } }
    }
    return d ? { s: d, next: k } : null;
  }

  function numStr(t) {
    if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) return t.replace(/\./g, '').replace(',', '.');
    t = t.replace(',', '.');
    return /^\d*\.?\d+$/.test(t) ? t : null;
  }

  function normalize(txt) {
    return String(txt).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/×|\*/g, ' por ').replace(/÷|\//g, ' dividido ').replace(/\+/g, ' mas ')
      .replace(/[−–—-]/g, ' menos ').replace(/=/g, ' igual ').replace(/%/g, ' porciento ')
      .replace(/\(/g, ' abre ').replace(/\)/g, ' cierra ');
  }

  // Texto hablado -> lista de eventos para la calculadora
  function parseSpeech(txt) {
    var tk = normalize(txt).match(/\d+(?:[.,]\d+)*|[a-z]+/g) || [];
    var ev = [], i = 0, sawCuanto = false, hasEq = false;
    while (i < tk.length) {
      var t = tk[i];
      var ns = /^\d/.test(t) ? numStr(t) : null;

      if (ns !== null) {
        var val = parseFloat(ns);
        i++;
        if (tk[i] === 'mil' || tk[i] === 'millon' || tk[i] === 'millones') {
          val *= tk[i] === 'mil' ? 1000 : 1000000;
          i++;
          if (i < tk.length) {
            var ns2 = /^\d/.test(tk[i]) ? numStr(tk[i]) : null;
            if (ns2 !== null && /^\d+$/.test(ns2) && parseFloat(ns2) < val) { val += parseFloat(ns2); i++; }
            else { var w2 = parseWords(tk, i); if (w2 && w2.v < val) { val += w2.v; i = w2.next; } }
          }
        } else if ((tk[i] === 'coma' || tk[i] === 'punto') && ns.indexOf('.') === -1) {
          var d = readDec(tk, i);
          if (d) { val = parseFloat(ns + '.' + d.s); i = d.next; }
        }
        ev.push({ t: 'num', s: plain(val) });
        continue;
      }

      if (has(UNITS, t) || t === 'mil' || t === 'millon' || t === 'millones') {
        var w = parseWords(tk, i);
        if (w) {
          var v2 = w.v;
          i = w.next;
          if ((tk[i] === 'coma' || tk[i] === 'punto') && i + 1 < tk.length) {
            var d2 = readDec(tk, i);
            if (d2) { v2 = parseFloat(String(v2) + '.' + d2.s); i = d2.next; }
          }
          ev.push({ t: 'num', s: plain(v2) });
          continue;
        }
      }

      i++;
      if (t === 'mas' || t === 'suma' || t === 'sumar' || t === 'sumale' || t === 'sumá') ev.push({ t: 'op', k: '+' });
      else if (t === 'menos' || t === 'resta' || t === 'restar' || t === 'restale') ev.push({ t: 'op', k: '−' });
      else if (t === 'por' && tk[i] === 'ciento') { i++; ev.push({ t: 'pct' }); }
      else if (t === 'por' || t === 'x' || t === 'veces') ev.push({ t: 'op', k: '×' });
      else if (t === 'multiplicado' || t === 'multiplicar' || t === 'multiplica') { if (tk[i] === 'por') i++; ev.push({ t: 'op', k: '×' }); }
      else if (t === 'dividido' || t === 'dividir' || t === 'divide') { if (tk[i] === 'por' || tk[i] === 'entre' || tk[i] === 'en') i++; ev.push({ t: 'op', k: '÷' }); }
      else if (t === 'entre' || t === 'sobre') ev.push({ t: 'op', k: '÷' });
      else if (t === 'porciento' || t === 'porcentaje') ev.push({ t: 'pct' });
      else if (t === 'abre' || t === 'abrir' || t === 'abri') { if (tk[i] === 'parentesis') i++; ev.push({ t: 'par', k: '(' }); }
      else if (t === 'cierra' || t === 'cerrar' || t === 'cerra') { if (tk[i] === 'parentesis') i++; ev.push({ t: 'par', k: ')' }); }
      else if (t === 'igual' || t === 'resultado' || t === 'equivale' || t === 'calcula' || t === 'calcular' || t === 'calculalo' || t === 'resolve' || t === 'resolver') { hasEq = true; ev.push({ t: 'eq' }); }
      else if (t === 'guardar' || t === 'guarda' || t === 'guardalo' || t === 'guardame' || t === 'anota' || t === 'anotar' || t === 'anotala' || t === 'registrar') ev.push({ t: 'save' });
      else if (t === 'borrar' || t === 'borra' || t === 'limpiar' || t === 'limpia' || t === 'reiniciar' || t === 'resetear' || t === 'nueva' || t === 'nuevo') { if (tk[i] === 'todo') i++; ev.push({ t: 'clear' }); }
      else if (t === 'chau' || t === 'parar' || t === 'detener' || t === 'cortar') ev.push({ t: 'stop' });
      else if (t === 'cuanto') sawCuanto = true;
    }
    if (sawCuanto && !hasEq && ev.length && !ev.some(function (e) { return e.t === 'save' || e.t === 'clear' || e.t === 'stop'; })) ev.push({ t: 'eq' });
    return ev;
  }

  /* ----- voz que habla ----- */
  function pickVoice() {
    var vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    var es = vs.filter(function (v) { return /^es/i.test(v.lang); });
    if (!es.length) return null;
    var girl = /paulina|monica|helena|sabina|laura|luciana|google espa|female|mujer/i;
    var pick = function (list) { return list.filter(function (v) { return girl.test(v.name); })[0] || list[0]; };
    var ar = es.filter(function (v) { return /^es[-_]AR/i.test(v.lang); });
    if (ar.length) return pick(ar);
    var latam = es.filter(function (v) { return /^es[-_](419|MX|US|CO|CL|UY)/i.test(v.lang); });
    if (latam.length) return pick(latam);
    return pick(es);
  }

  function speak(text) {
    var synth = window.speechSynthesis;
    if (!text || !synth || !window.SpeechSynthesisUtterance) return;
    var btn = $('calcVoiceBtn');
    try { synth.cancel(); } catch (e) {}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-AR';
    u.pitch = 1.35;
    u.rate = 1.03;
    var v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    speaking = true;
    if (rec && listening) { try { rec.abort(); } catch (e) {} }
    if (btn) btn.classList.add('is-speaking');
    var done = function () {
      if (!speaking) return;
      speaking = false;
      if (btn) btn.classList.remove('is-speaking');
      if (listening) setTimeout(function () { try { rec.start(); } catch (e) {} }, 250);
    };
    u.onend = done;
    u.onerror = done;
    setTimeout(done, 9000);
    synth.speak(u);
  }

  /* ----- carita del globito ----- */
  function voiceUI(state, title, text) {
    var btn = $('calcVoiceBtn'), t = $('calcVoiceTitle'), x = $('calcVoiceText');
    if (!btn) return;
    if (state === 'on') { btn.classList.add('is-listening'); btn.setAttribute('aria-pressed', 'true'); }
    else if (state === 'off') { btn.classList.remove('is-listening'); btn.setAttribute('aria-pressed', 'false'); }
    if (title !== null && title !== undefined) t.textContent = title;
    if (text !== null && text !== undefined) x.textContent = text;
  }

  var lastCap = '';

  // "igual" / "guardar": calcula, y si hace falta guarda en el historial; devuelve lo que se dice en voz alta
  function doEq(save) {
    lastCap = '';
    if (errorMsg) return 'Uy, no pude hacer esa cuenta';
    if (!justEval) {
      if (cleanExpr(expr) === '') return save ? 'Todavía no hay nada para guardar' : 'Todavía no hay ninguna cuenta';
      press('=');
      if (errorMsg) return errorMsg === 'División por 0' ? 'No se puede dividir por cero' : 'Uy, no pude hacer esa cuenta';
    }
    if (!justEval || lastRes === null) return 'No pude hacer esa cuenta';
    var top = hist[hist.length - 1];
    var saved = !!(top && top.expr === lastExpr && top.res === lastRes);
    if (save && !saved) { pushHist(lastExpr, lastRes); saved = true; }
    var res = fmt(lastRes).replace('-', 'menos ');
    lastCap = lastExpr + ' = ' + fmt(lastRes) + (save ? '  ♡ guardada' : '');
    return save ? 'Listo, guardé la cuenta. El resultado es ' + res : 'Es igual a ' + res;
  }

  // Lo que se va escuchando, escrito en la pantalla mientras se dicta (6 + 6 = 12)
  function previewFrom(text) {
    var ev = parseSpeech(text);
    if (!ev.length) return '';
    var src = errorMsg ? '' : expr;
    if (justEval && ev[0].t === 'num') src = '';
    var wantsEq = false;
    ev.forEach(function (e) {
      if (e.t === 'num') src += e.s;
      else if (e.t === 'op' || e.t === 'par') src += e.k;
      else if (e.t === 'pct') src += '%';
      else if (e.t === 'clear') src = '';
      else if (e.t === 'eq' || e.t === 'save') wantsEq = true;
    });
    var c = cleanExpr(src);
    if (!c) return '';
    if (wantsEq) {
      try { return show(c) + ' = ' + fmt(evaluate(c)); } catch (err) { return show(src); }
    }
    return show(src);
  }

  function clearPreview() {
    if (voicePreview) { voicePreview = ''; render(); }
  }

  function handleUtterance(text) {
    voicePreview = '';
    if (testMode) {
      testMode = false;
      clearTimeout(testTimer);
      stopListening();
      var shown = text.trim();
      voiceUI(null, '¡El micrófono funciona! Escuché:', '“' + shown + '”');
      speak('Te escuché. Dijiste: ' + shown);
      return;
    }
    var ev = parseSpeech(text);
    if (!ev.length) { voiceUI(null, 'No te entendí…', '“' + text.trim() + '” — probá de nuevo ♡'); return; }
    var say = '', stopAfter = false;
    ev.forEach(function (e) {
      if (e.t === 'num') e.s.split('').forEach(function (c) { press(c); });
      else if (e.t === 'op' || e.t === 'par') press(e.k);
      else if (e.t === 'pct') press('%');
      else if (e.t === 'eq') say = doEq(false);
      else if (e.t === 'save') say = doEq(true);
      else if (e.t === 'clear') { press('ON'); lastCap = ''; say = 'Listo, borré todo'; }
      else if (e.t === 'stop') stopAfter = true;
    });
    voiceUI(null, lastCap || 'Escuché', lastCap ? say : '“' + text.trim() + '”');
    if (say) speak(say);
    if (stopAfter) stopListening();
  }

  function startListening() {
    if (!SR) { voiceUI('off', 'Tu navegador no tiene voz', 'Probá con Chrome, Edge o Safari ♡'); return; }
    if (!isOn) press('ON');
    try {
      if (window.speechSynthesis && window.SpeechSynthesisUtterance) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    } catch (e) {}
    try { rec = new SR(); } catch (e) { voiceUI('off', 'No pude prender el micrófono', 'Probá de nuevo ♡'); return; }
    rec.lang = 'es-AR';
    rec.interimResults = true;
    rec.continuous = !MOBILE;
    rec.maxAlternatives = 1;
    rec.onresult = function (e) {
      var interim = '';
      for (var n = e.resultIndex; n < e.results.length; n++) {
        var r = e.results[n];
        if (r.isFinal) handleUtterance(r[0].transcript);
        else interim += r[0].transcript;
      }
      if (interim) {
        voicePreview = testMode ? '' : previewFrom(interim);
        render();
        voiceUI(null, 'Te escucho…', '“' + interim.trim() + '”');
      } else if (voicePreview) { clearPreview(); }
    };
    rec.onerror = function (e) {
      var er = e && e.error;
      if (er === 'not-allowed' || er === 'service-not-allowed') {
        listening = false; voiceUI('off', 'Necesito el micrófono', 'Permitilo en el navegador y probá otra vez ♡');
      } else if (er === 'audio-capture') {
        listening = false; voiceUI('off', 'No encuentro el micrófono', 'Revisá que esté conectado ♡');
      } else if (er === 'network') {
        listening = false; voiceUI('off', 'Sin conexión', 'La voz necesita internet ♡');
      }
    };
    rec.onend = function () {
      if (listening && !speaking) {
        setTimeout(function () { if (listening && !speaking) { try { rec.start(); } catch (e) {} } }, 150);
      } else if (!listening) {
        clearPreview();
        voiceUI('off');
      }
    };
    listening = true;
    voiceUI('on', 'Te escucho…', 'Decí la cuenta y después «igual» o «guardar»');
    try { rec.start(); } catch (e) {}
  }

  function stopListening() {
    listening = false;
    testMode = false;
    clearTimeout(testTimer);
    clearPreview();
    try { if (rec) rec.abort(); } catch (e) {}
    voiceUI('off', 'Micrófono apagado', 'Tocá el micrófono y decime una cuenta ♡');
  }

  var testMode = false, testTimer = null;

  // Prueba 1: que la calculadora hable
  function testVoice() {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
      voiceUI(null, 'Tu navegador no puede hablar', 'Probá con Chrome, Edge o Safari ♡');
      return;
    }
    var v = pickVoice();
    voiceUI(null, 'Probando la voz…', 'Voz: ' + (v ? v.name + ' (' + v.lang + ')' : 'la del sistema') + ' · si me escuchás, anda ♡');
    speak('Hola, así suena mi voz. Dos más dos es igual a cuatro.');
  }

  // Prueba 2: que el micrófono te escuche (no toca la calculadora)
  function testMic() {
    if (!SR) { voiceUI('off', 'Tu navegador no tiene voz', 'Probá con Chrome, Edge o Safari ♡'); return; }
    if (listening) stopListening();
    startListening();
    if (!listening) return;
    testMode = true;
    voiceUI(null, 'Probando el micrófono…', 'Decí cualquier cosa, por ejemplo «dos más dos»');
    clearTimeout(testTimer);
    testTimer = setTimeout(function () {
      if (!testMode) return;
      stopListening();
      voiceUI('off', 'No te escuché nada', 'Revisá el permiso del micrófono y probá de nuevo ♡');
    }, 12000);
  }

  function initVoice() {
    var btn = $('calcVoiceBtn');
    if (!btn) return;
    if (!SR) voiceUI(null, 'Tu navegador no tiene voz', 'Probá con Chrome, Edge o Safari ♡');
    btn.addEventListener('click', function () {
      if (listening) stopListening(); else startListening();
    });
    var tv = $('calcTestVoiceBtn'), tm = $('calcTestMicBtn');
    if (tv) tv.addEventListener('click', testVoice);
    if (tm) tm.addEventListener('click', testMic);
  }

  function setOpen(open) {
    var body = $('calcBody'), btn = $('calcToggleBtn');
    if (!body || !btn) return;
    body.hidden = !open;
    btn.textContent = open ? '▲ Ocultar Re calculando' : '▼ Mostrar Re calculando';
  }

  function init() {
    if ($('calculadora')) return;
    build();

    $('calcDevice').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-k]');
      if (btn) press(btn.getAttribute('data-k'));
    });
    $('calcToggleBtn').addEventListener('click', function () { setOpen($('calcBody').hidden); });
    $('calcPdfBtn').addEventListener('click', exportPDF);
    $('calcCsvBtn').addEventListener('click', exportCSV);
    $('calcClearBtn').addEventListener('click', function () {
      if (!hist.length) return;
      if (confirm('¿Borrar todo el historial de la calculadora?')) {
        hist = [];
        saveHist();
        renderHist();
      }
    });
    document.addEventListener('keydown', onKeydown);
    initVoice();

    // Botón en el encabezado (después de Changui)
    var nav = document.querySelector('.header-actions a[href="#changui"]');
    if (nav && !document.querySelector('.header-actions a[href="#calculadora"]')) {
      var a = document.createElement('a');
      a.href = '#calculadora';
      a.className = 'pastel-btn';
      a.textContent = '🧮 Re calculando';
      a.addEventListener('click', function () { setOpen(true); });
      nav.after(a);
    }

    renderHist();
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>
document.addEventListener('DOMContentLoaded',function(){
var C={'':'#ff7597','dark-mode':'#2a161d','dark-blue-mode':'#0f1c3f','black-mode':'#000'};
var b=document.getElementById('calcBody');if(b)b.hidden=false;
function set(m){document.body.className=m;try{localStorage.setItem('recalc_theme',m)}catch(e){}
document.querySelectorAll('[data-theme]').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.theme===m)});
document.querySelector('meta[name=theme-color]').content=C[m]||'#ff7597'}
document.querySelectorAll('[data-theme]').forEach(function(x){x.addEventListener('click',function(){set(x.dataset.theme)})});
set(document.body.className||'')});
</script>
</body>
